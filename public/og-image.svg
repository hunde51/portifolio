<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAFAF7"/>

  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EDE8DF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FAFAF7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Name -->
  <text x="80" y="260"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-style="italic"
    fill="#111111"
    letter-spacing="-2">Hunde Tesfa.</text>

  <!-- Tagline -->
  <text x="82" y="330"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="28"
    fill="#666666"
    letter-spacing="0">Fullstack Engineer · Agentic AI Systems</text>

  <!-- Stack badges -->
  <g font-family="monospace" font-size="13" letter-spacing="2" fill="#999999">
    <text x="82" y="410">FASTAPI</text>
    <text x="200" y="410">NEXT.JS</text>
    <text x="310" y="410">LANGGRAPH</text>
    <text x="450" y="410">REACT</text>
    <text x="540" y="410">PYTHON</text>
    <text x="650" y="410">TYPESCRIPT</text>
  </g>

  <!-- Divider line -->
  <line x1="80" y1="440" x2="400" y2="440" stroke="#111111" stroke-width="1" stroke-opacity="0.12"/>

  <!-- URL -->
  <text x="82" y="480"
    font-family="monospace"
    font-size="16"
    fill="#999999"
    letter-spacing="1">hundefest.vercel.app</text>

  <!-- H monogram -->
  <rect x="1060" y="60" width="80" height="80" rx="40" fill="#111111"/>
  <text x="1100" y="113"
    font-family="-apple-system, BlinkMacSystemFont, sans-serif"
    font-size="32"
    font-weight="600"
    fill="#FAFAF7"
    text-anchor="middle">H</text>
</svg>
